name: mass-algo
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - run: python algo.py
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
